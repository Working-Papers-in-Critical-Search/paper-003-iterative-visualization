project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  resources:
    # JSON consumed by the embedded visualizations via fetch() — Quarto can't
    # detect these automatically, so they must be declared to be copied to _site.
    - data/

website:
  title: "Working Papers in Critical Search"
  site-url: https://working-papers-in-critical-search.github.io/paper-003-iterative-visualization/
  open-graph: true
  twitter-card: true
  # No Quarto navbar / page-footer — chrome injected via includes below
  # to match the journal home site.

format:
  html:
    theme:
      - cosmo
      - _tokens.scss
      - _custom.scss
      - _paper.scss
    toc: true
    code-fold: true
    code-tools: true
    anchor-sections: false
    title-block-style: default
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - _includes/fonts.html
      - _includes/viz-head.html
      - text: |
          <link rel="canonical" href="https://working-papers-in-critical-search.github.io/paper-003-iterative-visualization/">
          <meta property="og:url" content="https://working-papers-in-critical-search.github.io/paper-003-iterative-visualization/">
          <meta name="twitter:url" content="https://working-papers-in-critical-search.github.io/paper-003-iterative-visualization/">
    include-before-body:
      - _includes/topbar.html
      - _includes/paper-id.html
    include-after-body:
      - _includes/footer.html
      - _includes/mobile-toc.html
      - text: '<script src="https://hypothes.is/embed.js" async></script>'

comments:
  giscus:
    repo: Working-Papers-in-Critical-Search/home
    category: "Comments"
    mapping: url
    reactions-enabled: true
    loading: lazy
    input-position: top

execute:
  freeze: auto
