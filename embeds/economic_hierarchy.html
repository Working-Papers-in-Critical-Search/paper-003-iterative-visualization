<figure class="wpcs-viz">
<div class="wpcs-viz__frame" id="viz-econ">
  <div class="wpcs-viz__loading">Loading the Economic Hierarchy map…</div>
  <style>
    /* ── Scoped: every rule lives under #viz-econ ───────────────────────────── */
    #viz-econ { height: 100%; display: flex; flex-direction: column;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000; color: #eee; }
    #viz-econ * { box-sizing: border-box; }
    #viz-econ .ehd-header {
      background: #1a1a1e; padding: 9px 16px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 3px solid #0b6a41; z-index: 10; }
    #viz-econ .ehd-header h2 { color: #fff; font-size: 0.98em; margin: 0; }
    #viz-econ .ehd-header p { color: #9A9B9D; font-size: 11px; margin: 0; }
    #viz-econ .ehd-container { display: flex; flex: 1; min-height: 0; }
    #viz-econ .ehd-map { flex: 1; height: 100%; }
    #viz-econ .ehd-sidebar { width: 290px; background: #1a1a1e; display: flex;
      flex-direction: column; overflow: hidden; border-left: 1px solid #252528; }
    #viz-econ .ehd-scroll { flex: 1; overflow-y: auto; padding: 12px; }
    #viz-econ .ehd-scroll::-webkit-scrollbar { width: 6px; }
    #viz-econ .ehd-scroll::-webkit-scrollbar-track { background: #000; }
    #viz-econ .ehd-scroll::-webkit-scrollbar-thumb { background: #0b6a41; border-radius: 3px; }
    #viz-econ .ehd-filters { padding: 8px 12px; background: #252528;
      border-bottom: 1px solid #000; display: flex; gap: 5px; flex-wrap: wrap; }
    #viz-econ .filter-btn { display: flex; align-items: center; gap: 4px; padding: 4px 9px;
      border-radius: 3px; border: 1px solid transparent; cursor: pointer; font-size: 11px;
      font-weight: bold; transition: all 0.2s; background: #1a1a1e; }
    #viz-econ .filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    #viz-econ .filter-btn.active { border-color: currentColor; }
    #viz-econ .filter-btn.inactive { opacity: 0.35; }
    #viz-econ .empty-state { text-align: center; padding: 30px 18px; color: #9A9B9D; font-size: 13px; }
    #viz-econ .empty-state .icon { font-size: 30px; margin-bottom: 10px; }
    #viz-econ .empty-state p { margin-bottom: 6px; }
    #viz-econ .info-card { background: #252528; border-radius: 5px; padding: 10px 12px; margin-bottom: 10px; }
    #viz-econ .info-card h2 { color: #f1c730; font-size: 1.02em; margin: 0 0 6px; }
    #viz-econ .tier-badge { display: inline-block; padding: 3px 9px; border-radius: 3px;
      font-size: 11px; font-weight: bold; color: #000; margin-bottom: 8px; }
    #viz-econ .stat-row { display: flex; justify-content: space-between; padding: 3px 0;
      border-bottom: 1px solid #1a1a1e; font-size: 12px; }
    #viz-econ .stat-row .label { color: #9A9B9D; }
    #viz-econ .stat-row .value { color: #eee; font-weight: bold; }
    #viz-econ .section-header { color: #f1c730; font-size: 11px; font-weight: bold;
      margin: 10px 0 5px; padding-bottom: 3px; border-bottom: 1px solid #0b6a41;
      text-transform: uppercase; letter-spacing: 0.4px; }
    #viz-econ .tier-blurb { background: #252528; border-radius: 4px; padding: 8px 10px;
      font-size: 11px; color: #bbb; line-height: 1.5; margin-bottom: 8px; }
    #viz-econ .tier-blurb strong { color: #eee; }
    #viz-econ .rwy-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    #viz-econ .rwy-pill { padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: bold; color: #fff; }
    #viz-econ .rwy-cpr { background: #c0392b; }
    #viz-econ .rwy-cnr { background: #1565c0; }
    #viz-econ .rwy-gtp { background: #2e7d32; }
    #viz-econ .rwy-other { background: #555; }
    #viz-econ .ehd-legend { padding: 8px 12px; background: #252528; border-top: 1px solid #000; }
    #viz-econ .legend-title { color: #9A9B9D; font-size: 10px; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px; }
    #viz-econ .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
    #viz-econ .legend-item { display: flex; align-items: center; font-size: 11px; color: #ccc; }
    #viz-econ .legend-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
    #viz-econ .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    #viz-econ .stats-card { border-radius: 4px; padding: 7px 9px; text-align: center; }
    #viz-econ .stats-card .sc-count { font-size: 1.4em; font-weight: bold; color: #000; }
    #viz-econ .stats-card .sc-label { font-size: 10px; color: #333; margin-top: 1px; }
    #viz-econ .wage-chart { margin-bottom: 10px; }
    #viz-econ .wage-row { display: flex; align-items: center; margin-bottom: 5px; gap: 6px; }
    #viz-econ .wage-tier-label { width: 34px; font-size: 10px; font-weight: bold; flex-shrink: 0; text-align: right; }
    #viz-econ .wage-bar-track { flex: 1; background: #111; border-radius: 2px; height: 14px; position: relative; }
    #viz-econ .wage-bar-fill { height: 100%; border-radius: 2px; position: relative; }
    #viz-econ .wage-bar-label { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      font-size: 9px; font-weight: bold; color: #000; white-space: nowrap; }
    #viz-econ .wage-caption { font-size: 10px; color: #666; margin-top: 3px; line-height: 1.4; }
    #viz-econ .ehd-tip { background: #1a1a1e !important; color: #f1c730 !important;
      border: 1px solid #0b6a41 !important; font-family: inherit; font-size: 12px;
      padding: 3px 8px; border-radius: 3px; }
    #viz-econ .ehd-tip::before { border-top-color: #0b6a41 !important; }
  </style>

  <div class="ehd-header">
    <div>
      <h2>Economic Hierarchy — Saskatchewan, 1921</h2>
      <p>Commercial service tier of 429 incorporated municipalities</p>
    </div>
  </div>

  <div class="ehd-container">
    <div class="ehd-map" id="econ-map"></div>
    <div class="ehd-sidebar">
      <div class="ehd-filters">
        <button class="filter-btn active" data-tier="City" style="color:#ef5350"><span class="dot" style="background:#ef5350"></span>City</button>
        <button class="filter-btn active" data-tier="RSC" style="color:#ffa726"><span class="dot" style="background:#ffa726"></span>RSC</button>
        <button class="filter-btn active" data-tier="LSC" style="color:#ffee58"><span class="dot" style="background:#ffee58"></span>LSC</button>
        <button class="filter-btn active" data-tier="SSC" style="color:#81c784"><span class="dot" style="background:#81c784"></span>SSC</button>
      </div>
      <div class="ehd-scroll">
        <div id="econ-detailPanel">
          <div class="empty-state">
            <div class="icon">&#127758;</div>
            <p>Click any settlement to see its tier</p>
            <p style="margin-top:10px;font-size:11px;">429 settlements &bull; 1921 census</p>
          </div>
          <div id="econ-summaryPanel">
            <div class="section-header">Organisational Character</div>
            <div class="wage-chart">
              <div class="wage-row"><span class="wage-tier-label" style="color:#ef5350">City</span><div class="wage-bar-track"><div class="wage-bar-fill" style="width:83.1%;background:#ef5350"><span class="wage-bar-label">83%</span></div></div></div>
              <div class="wage-row"><span class="wage-tier-label" style="color:#ffa726">RSC</span><div class="wage-bar-track"><div class="wage-bar-fill" style="width:68.7%;background:#ffa726"><span class="wage-bar-label">69%</span></div></div></div>
              <div class="wage-row"><span class="wage-tier-label" style="color:#ffee58">LSC</span><div class="wage-bar-track"><div class="wage-bar-fill" style="width:63.2%;background:#ffee58"><span class="wage-bar-label" style="color:#333">63%</span></div></div></div>
              <div class="wage-row"><span class="wage-tier-label" style="color:#81c784">SSC</span><div class="wage-bar-track"><div class="wage-bar-fill" style="width:58.6%;background:#81c784"><span class="wage-bar-label" style="color:#333">59%</span></div></div></div>
              <div class="wage-caption">% of workforce in wage employment (1921 census). A wage-earner majority across all tiers signals an urban labour market, not a subsistence farm economy.</div>
            </div>
            <div class="section-header">Provincial Overview</div>
            <div class="stats-grid">
              <div class="stats-card" style="background:#ef5350"><div class="sc-count">7</div><div class="sc-label">Cities</div></div>
              <div class="stats-card" style="background:#ffa726"><div class="sc-count">39</div><div class="sc-label">Regional SCs</div></div>
              <div class="stats-card" style="background:#ffee58"><div class="sc-count">27</div><div class="sc-label">Local SCs</div></div>
              <div class="stats-card" style="background:#81c784"><div class="sc-count">356</div><div class="sc-label">Small SCs</div></div>
            </div>
            <div class="section-header">Tier Definitions</div>
            <div id="econ-tierDefinitions"></div>
          </div>
        </div>
      </div>
      <div class="ehd-legend">
        <div class="legend-title">Commercial Tier</div>
        <div class="legend-grid">
          <div class="legend-item"><span class="legend-dot" style="background:#ef5350"></span>City (7)</div>
          <div class="legend-item"><span class="legend-dot" style="background:#ffa726"></span>RSC (39)</div>
          <div class="legend-item"><span class="legend-dot" style="background:#ffee58"></span>LSC (27)</div>
          <div class="legend-item"><span class="legend-dot" style="background:#81c784"></span>SSC (356)</div>
        </div>
        <div class="legend-title" style="margin-top:8px">Railway</div>
        <div class="legend-grid">
          <div class="legend-item"><span class="legend-dot" style="background:#c0392b;border-radius:2px;height:4px;width:14px;margin-right:4px"></span>CPR</div>
          <div class="legend-item"><span class="legend-dot" style="background:#1565c0;border-radius:2px;height:4px;width:14px;margin-right:4px"></span>CNR</div>
          <div class="legend-item"><span class="legend-dot" style="background:#2e7d32;border-radius:2px;height:4px;width:14px;margin-right:4px"></span>GTP</div>
        </div>
      </div>
    </div>
  </div>
</div>
<figcaption><span class="wpcs-fignum">Figure&nbsp;2.</span> Economic Hierarchy Map — all 429 incorporated municipalities of 1921 Saskatchewan coloured by commercial service tier (City, Regional, Local, Small). Click a settlement for its profile; toggle tiers with the filter bar. <a class="wpcs-viz__full" href="https://jjax07.github.io/Sask_Railway_Visualizations/economic_hierarchy.html" target="_blank" rel="noopener">Open full-screen&nbsp;↗</a></figcaption>
</figure>

<script>
(function () {
  var root = document.getElementById('viz-econ');
  if (!root || root.dataset.init) return;

  function init() {
    if (root.dataset.init) return;
    root.dataset.init = '1';

    var TIER_COLORS = { City: '#ef5350', RSC: '#ffa726', LSC: '#ffee58', SSC: '#81c784' };
    var TIER_LABELS = { City: 'City', RSC: 'Regional Service Centre', LSC: 'Local Service Centre', SSC: 'Small Service Centre' };
    var RAILWAY_COLORS = { CPR: '#c0392b', CNR: '#1565c0', GTP: '#2e7d32', Other: '#555555' };

    var settlements = {}, markers = {}, activeFilters = new Set(['City', 'RSC', 'LSC', 'SSC']);

    var map = L.map('econ-map', { zoomSnap: 0.5, scrollWheelZoom: false }).setView([52.0, -106.0], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);

    function markerRadius(pop, tier) {
      var base = pop ? Math.max(4, Math.min(14, Math.log(pop) * 1.4)) : 5;
      if (tier === 'City') return Math.max(base, 9);
      if (tier === 'RSC') return Math.max(base, 6);
      return base;
    }
    function escHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function rwyPillClass(r) { return ({ CPR: 'rwy-cpr', CNR: 'rwy-cnr', GTP: 'rwy-gtp' })[r] || 'rwy-other'; }
    function railwayPills(railways) { return (railways || []).map(function (r) { return '<span class="rwy-pill ' + rwyPillClass(r) + '">' + r + '</span>'; }).join(''); }

    function highlight(name) {
      Object.values(markers).forEach(function (m) { m.setStyle({ weight: 1, opacity: 0.8, fillOpacity: 0.85 }); });
      var s = settlements[name], m = markers[name];
      if (s && m) { m.setStyle({ weight: 3, opacity: 1, fillOpacity: 1 }); m.setRadius(markerRadius(s.population, s.tier) + 3); }
    }

    var INDUSTRY_DISPLAY = { 'Private households': 'Domestic service (private households)', 'Not specified retail trade': 'Retail trade (unspecified)', 'Not specified manufacturing industries': 'Manufacturing (unspecified)', 'Electrical goods, hardware, and plumbing equipment': 'Hardware & electrical goods', 'Railroads and railway express service': 'Railroads & railway express', 'Auto repair services and garages': 'Auto repair & garages', 'Food stores, except dairy products': 'Food stores', 'General merchandise stores': 'General merchandise', 'Eating and drinking places': 'Eating & drinking establishments', 'Misc. personal services': 'Personal services', 'Local public administration': 'Local government', 'Motor vehicles and equipment': 'Motor vehicles & equipment', 'Banking and credit agencies': 'Banking & credit' };
    function industryLabel(name) { return INDUSTRY_DISPLAY[name] || name; }
    function localIndustriesHtml(s) {
      if (!s.localIndustries || !s.localIndustries.length) return '';
      var rows = s.localIndustries.map(function (d) { return '<div class="stat-row"><span class="label" style="flex:1;padding-right:8px">' + escHtml(industryLabel(d.industry)) + '</span><span class="value">' + d.pct + '%</span></div>'; }).join('');
      return '<div class="section-header">Dominant Industries</div><div style="background:#252528;border-radius:4px;padding:4px 8px;margin-bottom:8px;font-size:11px;"><div style="color:#666;font-size:10px;margin-bottom:4px;">Top 5 industries by share of local classified workforce</div>' + rows + '</div>';
    }
    function tierBlurb(tier) {
      return ({ City: 'Command-and-coordination node. Concentrated wholesale, state administration, legal, insurance, publishing, and utilities. Highest wage-employment and immigrant shares across all tiers.', RSC: 'Intermediate service hub. Elevated hotels, eating and drinking establishments, and personal services. Serves surrounding SSC catchment areas as a secondary centre.', LSC: 'Neighbourhood-scale service centre. Population ≥400 with banking. Provides basic commercial services to a local agricultural hinterland.', SSC: 'Farm-service focus: own-farm households dominate (45%), alongside lumber, hardware, and auto repair. The backbone of the conurbation — 356 of 429 settlements.' })[tier] || '';
    }
    function renderPanel(name) {
      var s = settlements[name];
      if (!s) return;
      var color = TIER_COLORS[s.tier] || '#aaa', label = TIER_LABELS[s.tier] || s.tier;
      root.querySelector('#econ-detailPanel').innerHTML =
        '<div class="info-card" style="border-left: 3px solid ' + color + '"><h2>' + escHtml(name) + '</h2>' +
        '<span class="tier-badge" style="background:' + color + '">' + escHtml(s.tier) + ' &mdash; ' + escHtml(label) + '</span>' +
        '<div class="stat-row"><span class="label">Population (1921)</span><span class="value">' + (s.population ? s.population.toLocaleString() : 'Unknown') + '</span></div>' +
        '<div class="stat-row"><span class="label">Railway</span><span class="value"><div class="rwy-pills">' + (railwayPills(s.railways) || '<span style="color:#666">None recorded</span>') + '</div></span></div></div>' +
        localIndustriesHtml(s) +
        '<div class="section-header">About this tier</div><div class="tier-blurb">' + tierBlurb(s.tier) + '</div>';
      root.querySelector('.ehd-scroll').scrollTop = 0;
    }

    var TIER_DESCRIPTIONS = {
      City: { color: '#ef5350', label: 'City', desc: 'Pop. ≥400, bank, and legal services. Command-and-coordination nodes with the highest wage-employment and immigrant shares across all tiers.' },
      RSC: { color: '#ffa726', label: 'Regional Service Centre', desc: 'Pop. ≥400, bank, and medical or legal services. Intermediate hubs with elevated hotels, eating places, and personal services.' },
      LSC: { color: '#ffee58', label: 'Local Service Centre', desc: 'Pop. ≥400 with a bank. Neighbourhood-scale service provision.' },
      SSC: { color: '#81c784', label: 'Small Service Centre', desc: 'All remaining settlements. Farm-service focus: own-farm households, lumber, hardware, and auto repair predominate.' }
    };
    var OVERVIEW_EXCLUDE = new Set(['Own Farm', 'Private households']);
    function renderTierDefinitions(byTier) {
      var order = ['City', 'RSC', 'LSC', 'SSC'];
      root.querySelector('#econ-tierDefinitions').innerHTML = order.map(function (tier) {
        var d0 = TIER_DESCRIPTIONS[tier];
        var industries = (byTier[tier] || []).filter(function (d) { return !OVERVIEW_EXCLUDE.has(d.industry); });
        var industryRows = industries.map(function (d) { return '<div class="stat-row"><span class="label" style="flex:1;padding-right:8px">' + escHtml(industryLabel(d.industry)) + '</span><span class="value">' + d.pct + '%</span></div>'; }).join('');
        return '<div class="tier-blurb"><strong style="color:' + d0.color + '">' + d0.label + '</strong> &mdash; ' + d0.desc +
          (industries.length ? '<div style="margin-top:6px;font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.4px;">Top industries (% of tier workforce)</div><div style="margin-top:2px">' + industryRows + '</div>' : '') + '</div>';
      }).join('');
    }

    var TIER_ORDER = ['SSC', 'LSC', 'RSC', 'City'];
    function placeMarkers() {
      var byTier = { City: [], RSC: [], LSC: [], SSC: [] };
      Object.values(settlements).forEach(function (s) { if (s.lat && s.lon) (byTier[s.tier] || byTier.SSC).push(s); });
      TIER_ORDER.forEach(function (tier) {
        byTier[tier].forEach(function (s) {
          var color = TIER_COLORS[tier];
          var m = L.circleMarker([s.lat, s.lon], { radius: markerRadius(s.population, tier), fillColor: color, color: tier === 'City' ? '#fff' : '#1a1a1e', weight: tier === 'City' ? 1.5 : 0.8, opacity: 0.9, fillOpacity: tier === 'SSC' ? 0.65 : 0.85 }).addTo(map);
          m.bindTooltip('<strong>' + s.name + '</strong><br>' + TIER_LABELS[tier], { permanent: false, direction: 'top', className: 'ehd-tip' });
          m.on('click', function () { selectSettlement(s.name); });
          markers[s.name] = m;
        });
      });
    }
    function updateVisibility() {
      Object.entries(markers).forEach(function (entry) {
        var s = settlements[entry[0]];
        if (activeFilters.has(s.tier)) entry[1].addTo(map); else entry[1].removeFrom(map);
      });
    }
    function selectSettlement(name) {
      var s = settlements[name];
      if (!s || !s.lat) return;
      renderPanel(name); highlight(name); map.panTo([s.lat, s.lon], { animate: true });
    }

    root.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tier = btn.dataset.tier;
        if (activeFilters.has(tier)) { activeFilters.delete(tier); btn.classList.remove('active'); btn.classList.add('inactive'); }
        else { activeFilters.add(tier); btn.classList.add('active'); btn.classList.remove('inactive'); }
        updateVisibility();
      });
    });

    var SK = { lonMin: -112, lonMax: -100, latMin: 48, latMax: 61 };
    function builderToCompany(b) {
      if (!b) return 'Other';
      b = b.toUpperCase();
      if (b.indexOf('CPR') === 0) return 'CPR';
      if (b.indexOf('CNOR') === 0 || b.indexOf('CNR') === 0) return 'CNR';
      if (b.indexOf('GTP') === 0) return 'GTP';
      return 'Other';
    }
    function drawTracks(tracks) {
      tracks.forEach(function (track) {
        if (!track.coordinates || track.coordinates.length < 2) return;
        var company = builderToCompany(track.builder_name);
        if (company === 'Other') return;
        if ((track.built_year || 0) > 1921) return;
        var hasSK = track.coordinates.some(function (c) { return c[0] >= SK.lonMin && c[0] <= SK.lonMax && c[1] >= SK.latMin && c[1] <= SK.latMax; });
        if (!hasSK) return;
        L.polyline(track.coordinates.map(function (c) { return [c[1], c[0]]; }), { color: RAILWAY_COLORS[company], weight: 1.5, opacity: 0.45, interactive: false }).addTo(map);
      });
    }

    Promise.all([
      fetch('data/tier_settlements.json'), fetch('data/railway_tracks.json'), fetch('data/industry_data.json')
    ]).then(function (res) { return Promise.all(res.map(function (r) { return r.json(); })); })
      .then(function (out) {
        settlements = out[0];
        drawTracks(out[1].tracks);
        placeMarkers();
        renderTierDefinitions(out[2].byTier);
        root.classList.add('is-ready');
        setTimeout(function () { map.invalidateSize(); }, 60);
      })
      .catch(function (err) {
        root.querySelector('#econ-detailPanel').innerHTML = '<div class="empty-state"><p style="color:#e57373">Failed to load data: ' + err.message + '</p></div>';
        root.classList.add('is-ready');
      });
  }

  var io = new IntersectionObserver(function (entries, obs) {
    entries.forEach(function (e) { if (e.isIntersecting) { init(); obs.disconnect(); } });
  }, { rootMargin: '300px' });
  io.observe(root);
})();
</script>
